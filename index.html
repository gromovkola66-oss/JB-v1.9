<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighthouse Keeper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Georgia', serif;
            cursor: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #gameCanvas {
            z-index: 1;
        }

        #uiCanvas {
            z-index: 2;
            pointer-events: none;
        }

        #cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 220, 100, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255, 220, 100, 0.4);
        }

        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at center bottom, #0d1b2a 0%, #050a14 100%);
        }

        #startScreen h1 {
            font-size: 4em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            letter-spacing: 3px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        #startScreen p {
            color: #8899aa;
            font-size: 1.2em;
            margin-bottom: 40px;
            font-style: italic;
        }

        #startBtn {
            padding: 15px 50px;
            font-size: 1.3em;
            font-family: 'Georgia', serif;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        #startBtn:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        #gameOverScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 15, 0.95);
        }

        #gameOverScreen h1 {
            font-size: 3em;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.5);
            margin-bottom: 10px;
        }

        #gameOverScreen .score {
            font-size: 1.5em;
            color: #ffd700;
            margin-bottom: 30px;
        }

        #restartBtn {
            padding: 15px 50px;
            font-size: 1.3em;
            font-family: 'Georgia', serif;
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        #restartBtn:hover {
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            transform: scale(1.05);
        }

        @keyframes glow {
            from { text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.3); }
            to { text-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 0 80px rgba(255, 215, 0, 0.5); }
        }
    </style>
</head>
<body>
    <div id="cursor"></div>
    
    <div id="startScreen">
        <h1>LIGHTHOUSE KEEPER</h1>
        <p>Guide the ships. Beware the deep.</p>
        <button id="startBtn">SET SAIL</button>
    </div>

    <div id="gameOverScreen">
        <h1>LOST AT SEA</h1>
        <p class="score">Ships Saved: <span id="finalScore">0</span></p>
        <button id="restartBtn">TRY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <canvas id="uiCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
